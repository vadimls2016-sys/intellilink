name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unpack
        run: |
          mkdir -p src
          git log --reverse --diff-filter=AM --name-only --format= -- '*.zip' | while read -r f; do
            if [ -f "$f" ]; then unzip -o "$f" -d src; fi
          done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build
        working-directory: src
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: IntelliLink-APK
          path: src/app/build/outputs/apk/debug/app-debug.apk
